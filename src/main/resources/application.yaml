server:
  port: 8081

spring:
  application:
    name: order-service
  kafka:
    bootstrap-servers: localhost:9092
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: >
          ORDER_CREATED:com.example.order_service.dto.OrderCreatedEvent,
          ORDER_UPDATED:com.example.order_service.dto.OrderUpdatedEvent,
          ORDER_CANCELLED:com.example.order_service.dto.OrderCancelledEvent
        interceptor.classes: com.example.order_service.observability.CorrelationIdProducerInterceptor
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.example.order_service.dto.InventoryResultEvent
        spring.json.trusted.packages: com.example.order_service.dto
  datasource:
    url: jdbc:postgresql://localhost:5432/orders_db
    username: postgres
    password: postgres123
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

loggin:
  pattern:
    level: "%5p [%{spring.application.name},%X{correlationId:-}]"
